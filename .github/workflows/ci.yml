# Проверка пул-реквеста: всё дерево Буквицы, читалка с её окном включительно,
# собранное и проверенное тестами на Windows-машине GitHub, Debug и Release
# рядом, с флагами самого дерева и ничем сверх них.
#
# Буквица собирается только вместе с wxl: корневой CMakeLists берёт её модули
# из соседнего дерева. Здесь это дерево — wxl ровно на том коммите, который
# назван в tools/wxl.json, а не текущая голова её main: проверяется то
# сочетание, которое потом окажется в main Буквицы.
#
# Тулсет — MSVC 14.53 из Build Tools канала Insiders, он ставится на каждом
# запуске, по той же причине, что у wxl (её .github/workflows/ci.yml): 14.51 из
# образа неверно компилирует корутину, чей final_suspend() возвращает
# suspend_never, в оптимизированном коде с /EHsc.
#
# wxl.ui нужно то, чего в репозитории wxl нет: закреплённые пакеты NuGet,
# проекция cppwinrt и обёртки, которые пишет winui-srcgen. Всё это делает сама
# wxl, и отдельных шагов для него нет: настройка Буквицы восстанавливает пакеты
# и строит проекцию в своём каталоге сборки (MSBuild той установки Build Tools,
# в которой есть компонент C++ WinUI; версии берутся из файла блокировки wxl,
# отсюда RestoreLockedMode), а сборка запускает ею же построенный генератор и
# компилирует обёртки вместе с читалкой.
#
# Коммиты пул-реквеста, его заголовок и описание проверяет отдельный workflow,
# commits.yml: он отвечает и на правку описания, а эта сборка — нет.
name: ci

# merge_group: ветка-кандидат очереди слияния, main плюс стоящие в очереди
# пул-реквесты, проверяемая до того, как стать main.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Новый пуш в тот же пул-реквест делает старый запуск ненужным.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # main Буквицы собирается только с теми коммитами wxl, что уже в main wxl.
  # Пул-реквест, чья пара в wxl ещё не влита, остаётся красным на этой проверке,
  # пока её не вольют; сборка ниже от неё не зависит и отвечает сама.
  wxl-revision:
    name: wxl-revision
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: Bukvitsa
          persist-credentials: false

      # Репозиторий в файле сверяется, а не берётся из него: иначе правка файла
      # уводила бы проверку в чужой репозиторий, где «main» значит что угодно.
      - name: Read the wxl pin
        id: pin
        run: |
          pin=Bukvitsa/tools/wxl.json
          if ! repository=$(jq -er '.repository' "$pin"); then
            echo "::error::$pin has no repository"
            exit 1
          fi
          if ! revision=$(jq -er '.revision' "$pin"); then
            echo "::error::$pin has no revision"
            exit 1
          fi
          if [ "$repository" != "wxl-project/wxl" ]; then
            echo "::error::$pin names $repository, not wxl-project/wxl"
            exit 1
          fi
          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::$pin: revision is not a full SHA"
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      # Вся история: закреплённый коммит ищется в ней.
      - uses: actions/checkout@v4
        with:
          repository: wxl-project/wxl
          ref: main
          path: wxl
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the pinned revision is on wxl's main
        working-directory: wxl
        env:
          REVISION: ${{ steps.pin.outputs.revision }}
        run: |
          if ! git cat-file -e "$REVISION^{commit}" 2>/dev/null; then
            echo "::error::wxl has no commit $REVISION"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$REVISION" origin/main; then
            echo "::error::wxl commit $REVISION is not on wxl's main"
            exit 1
          fi
          echo "wxl $REVISION is on main"

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Debug
            preset: x64-debug
          - config: Release
            preset: x64-release
    name: build (${{ matrix.config }})
    runs-on: windows-2025
    # Одна wxl в её собственной проверке собирается 47 минут. Здесь из её дерева
    # собираются генератор и wxl.ui, которая компилируется внутри сборки
    # Буквицы, и сама Буквица идёт сверх того.
    timeout-minutes: 120
    env:
      DEVCMD: C:\BuildToolsInsiders\Common7\Tools\VsDevCmd.bat
      VCVARS: -vcvars_ver=14.53
      # Куда настройка кладёт восстановленные пакеты; winui-srcgen и winxl
      # находят их по списку, который она пишет.
      NUGET_PACKAGES: C:\nuget-packages
      # MSBuild читает переменные среды как свойства: восстановление идёт в
      # режиме блокировки, по версиям из tools/packages.lock.json wxl, и файл
      # блокировки, не совпавший с закреплёнными версиями, останавливает
      # настройку, а не переписывается.
      RestoreLockedMode: true
    steps:
      # Оба дерева — соседние каталоги рабочей области, Bukvitsa и wxl, так что
      # BUKVITSA_WXL_ROOT по умолчанию (../wxl) указывает куда надо и не
      # задаётся.
      - uses: actions/checkout@v4
        with:
          path: Bukvitsa

      - name: Read the wxl pin
        id: pin
        shell: pwsh
        run: |
          $pin = Get-Content Bukvitsa/tools/wxl.json -Raw | ConvertFrom-Json
          if ($pin.repository -cne 'wxl-project/wxl') { throw "tools/wxl.json names $($pin.repository), not wxl-project/wxl" }
          if ($pin.revision -cnotmatch '^[0-9a-f]{40}$') { throw 'tools/wxl.json: revision is not a full SHA' }
          "revision=$($pin.revision)" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          repository: wxl-project/wxl
          ref: ${{ steps.pin.outputs.revision }}
          path: wxl
          persist-credentials: false

      # 3010 — «установлено, ждёт перезагрузки»: компилятор годен и так. Одна
      # установка на тулсет и на сборочные средства WinUI: VsDevCmd даёт из неё и
      # MSVC 14.53, и MSBuild, которым настройка восстанавливает пакеты.
      - name: Install MSVC 14.53 and the WinUI build tools
        shell: pwsh
        run: |
          $boot = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vs/insiders/vs_buildtools.exe' -OutFile $boot -UseBasicParsing
          $p = Start-Process -FilePath $boot -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru -ArgumentList @(
            '--installPath', 'C:\BuildToolsInsiders',
            '--add', 'Microsoft.VisualStudio.Component.VC.Preview.Tools.x86.x64',
            '--add', 'Microsoft.VisualStudio.Workload.UniversalBuildTools',
            '--add', 'Microsoft.VisualStudio.ComponentGroup.WindowsAppDevelopment.VC.BuildTools',
            '--quiet', '--wait', '--norestart', '--nocache')
          "exit code $($p.ExitCode)"
          Get-ChildItem 'C:\BuildToolsInsiders\VC\Tools\MSVC' | ForEach-Object { $_.Name }
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { throw "Build Tools install failed: $($p.ExitCode)" }

      # Без сайта: его машинерия ходила бы в сеть за Doxygen уже при настройке.
      # WXL_WINXL — утилита winxl, которая ставит читалке экспериментальную среду
      # Windows App Runtime (нужен .NET SDK 10, он есть в образе раннера).
      # Версии и кодовая страница Ninja — в журнал: Reader/src/Assets/Брошюра.png
      # идёт через правило Ninja с кириллицей в имени, ANSI-страница машины —
      # 1252, и уже первый журнал должен показать, пишет ли Ninja в UTF-8.
      - name: Configure
        shell: cmd
        working-directory: Bukvitsa
        run: |
          call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
          cmake --version
          ninja --version
          ninja -t wincodepage
          cmake --preset x64 -DBUKVITSA_BUILD_DOCS=OFF -DWXL_WINXL=ON

      # -k 0: все ошибки компиляции правки сразу, а не только первая.
      - name: Build
        id: build
        shell: cmd
        working-directory: Bukvitsa
        run: |
          call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
          cmake --build build\x64 --config ${{ matrix.config }} -- -k 0

      - name: Test
        shell: cmd
        working-directory: Bukvitsa
        run: |
          call "%DEVCMD%" -arch=x64 -host_arch=x64 %VCVARS%
          ctest --preset ${{ matrix.preset }} --output-on-failure --timeout 300 --output-junit ctest.xml

      # Окна WinUI не открывает ни один тест, его открывает читалка. Сначала
      # экспериментальная среда Windows App Runtime, которой просят обёртки,
      # потом читалка на двадцать секунд: без книги она показывает заставку, и
      # главное окно должно появиться на рабочем столе машины. После красных
      # тестов тоже — это разные вопросы, — но не после красной сборки: запускать
      # нечего.
      - name: Install the experimental Windows App Runtime
        if: (success() || failure()) && steps.build.outcome == 'success'
        shell: pwsh
        working-directory: Bukvitsa
        run: |
          & .\build\x64\wxl\winxl\winxl.exe runtime install --packages build\x64\wxl\wxl.packages\restored-packages.json

      # Процесс оконный, и отказ wxl уходит в stderr и OutputDebugString, которых
      # журнал не видит: потоки читалки перенаправлены в файлы и печатаются.
      - name: Start the reader
        if: (success() || failure()) && steps.build.outcome == 'success'
        shell: pwsh
        working-directory: Bukvitsa
        run: |
          $exe = "build\x64\Reader\${{ matrix.config }}\Reader.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          $exe = Get-Item $exe
          $out = Join-Path $env:RUNNER_TEMP 'reader.out'
          $err = Join-Path $env:RUNNER_TEMP 'reader.err'
          function Show-ReaderOutput {
            foreach ($file in $out, $err) {
              if (Test-Path $file) {
                "---- $file"
                Get-Content $file
              }
            }
          }
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          Start-Sleep -Seconds 20
          $p.Refresh()
          if ($p.HasExited) {
            Show-ReaderOutput
            throw "Reader exited within 20 s, code $($p.ExitCode)"
          }
          $window = $p.MainWindowHandle
          "running after 20 s; main window handle $window, title '$($p.MainWindowTitle)'"
          Stop-Process -Id $p.Id
          if ($window -eq 0) {
            Show-ReaderOutput
            throw 'Reader runs but shows no main window'
          }
          Show-ReaderOutput

      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.config }}
          path: |
            Bukvitsa/build/x64/Testing/Temporary/
            Bukvitsa/build/x64/ctest.xml
            Bukvitsa/build/x64/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
